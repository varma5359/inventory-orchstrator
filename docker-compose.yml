
services:
  inventory-api:
    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env

    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/enterprise_inventory.db

    ports:
      - "8001:8000"

    volumes:
      - inventory_data:/data

    command:
      - sh
      - -c
      - python -m app.seed && exec uvicorn app.main:app --host 0.0.0.0 --port 8000

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    restart: unless-stopped

volumes:
  inventory_data:
